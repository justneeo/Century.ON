<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Affiliate Intake</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#050505;
      --panel:rgba(255,255,255,0.06);
      --panel-2:rgba(255,255,255,0.04);
      --border:rgba(255,255,255,0.10);
      --border-strong:rgba(255,255,255,0.16);
      --text:#f5f5f5;
      --muted:#9b9b9f;
      --input:rgba(255,255,255,0.045);
      --input-focus:rgba(255,255,255,0.08);
      --button:#ffffff;
      --button-text:#050505;
      --radius:20px;
      --shadow:0 20px 60px rgba(0,0,0,0.45);
    }

    *{box-sizing:border-box}

    html,body{
      margin:0;
      padding:0;
      background:radial-gradient(circle at top, rgba(255,255,255,0.04), transparent 30%), var(--bg);
      color:var(--text);
      font-family:"Inter", sans-serif;
      min-height:100%;
    }

    body{
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:24px;
    }

    .wrap{
      width:100%;
      max-width:760px;
    }

    .card{
      background:linear-gradient(180deg, var(--panel), var(--panel-2));
      border:1px solid var(--border);
      border-radius:28px;
      backdrop-filter:blur(18px);
      -webkit-backdrop-filter:blur(18px);
      box-shadow:var(--shadow);
      padding:22px;
    }

    .topbar{
      display:flex;
      justify-content:space-between;
      align-items:flex-start;
      gap:16px;
      margin-bottom:18px;
    }

    .title{
      display:flex;
      flex-direction:column;
      gap:6px;
    }

    .title h1{
      margin:0;
      font-size:20px;
      font-weight:700;
      letter-spacing:-0.03em;
    }

    .title p{
      margin:0;
      font-size:13px;
      color:var(--muted);
    }

    .lang{
      min-width:180px;
    }

    label{
      display:block;
      font-size:12px;
      font-weight:600;
      color:#f0f0f0;
      margin-bottom:8px;
      letter-spacing:.02em;
    }

    .hint{
      margin-top:7px;
      font-size:11px;
      line-height:1.35;
      color:var(--muted);
    }

    form{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:14px;
    }

    .field{
      display:flex;
      flex-direction:column;
    }

    .field.full{
      grid-column:1 / -1;
    }

    input,
    select,
    textarea{
      width:100%;
      border:1px solid var(--border);
      background:var(--input);
      color:var(--text);
      border-radius:16px;
      padding:14px 15px;
      font:inherit;
      outline:none;
      transition:.2s ease;
    }

    input::placeholder,
    textarea::placeholder{
      color:#7f7f85;
    }

    input:focus,
    select:focus,
    textarea:focus{
      background:var(--input-focus);
      border-color:var(--border-strong);
    }

    select{
      appearance:none;
      -webkit-appearance:none;
      background-image:
        linear-gradient(45deg, transparent 50%, #bcbcbc 50%),
        linear-gradient(135deg, #bcbcbc 50%, transparent 50%);
      background-position:
        calc(100% - 20px) calc(50% - 3px),
        calc(100% - 14px) calc(50% - 3px);
      background-size:6px 6px, 6px 6px;
      background-repeat:no-repeat;
      padding-right:40px;
    }

    option{
      background:#111;
      color:#fff;
    }

    textarea{
      min-height:170px;
      resize:vertical;
      line-height:1.55;
    }

    .actions{
      grid-column:1 / -1;
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      margin-top:4px;
    }

    button{
      border:none;
      border-radius:14px;
      padding:14px 18px;
      font:inherit;
      font-weight:600;
      cursor:pointer;
      transition:.2s ease;
    }

    .primary{
      background:var(--button);
      color:var(--button-text);
    }

    .primary:hover{
      opacity:.92;
    }

    .secondary{
      background:rgba(255,255,255,0.06);
      color:var(--text);
      border:1px solid var(--border);
    }

    .secondary:hover{
      background:rgba(255,255,255,0.09);
    }

    .rtl{
      direction:rtl;
      text-align:right;
    }

    @media (max-width:720px){
      body{
        padding:14px;
      }

      .topbar{
        flex-direction:column;
      }

      .lang{
        width:100%;
        min-width:0;
      }

      form{
        grid-template-columns:1fr;
      }

      .actions{
        flex-direction:column;
      }

      .actions button{
        width:100%;
      }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card" id="app">
      <div class="topbar">
        <div class="title">
          <h1 id="title">Affiliate Form</h1>
          <p id="subtitle">@invictuzzzzz</p>
        </div>

        <div class="lang">
          <label for="uiLanguage" id="uiLanguageLabel">Language</label>
          <select id="uiLanguage">
            <option value="en">English</option>
            <option value="es">Español</option>
            <option value="de">Deutsch</option>
            <option value="fr">Français</option>
            <option value="it">Italiano</option>
            <option value="nl">Nederlands</option>
            <option value="ru">Русский</option>
            <option value="ar">العربية</option>
          </select>
        </div>
      </div>

      <form id="telegramForm">
        <div class="field">
          <label for="firstName" data-i18n="firstNameLabel">First name *</label>
          <input id="firstName" name="firstName" type="text" placeholder="First name" required autocomplete="given-name" />
        </div>

        <div class="field">
          <label for="lastName" data-i18n="lastNameLabel">Last name *</label>
          <input id="lastName" name="lastName" type="text" placeholder="Last name" required autocomplete="family-name" />
        </div>

        <div class="field">
          <label for="phone" data-i18n="phoneLabel">Phone *</label>
          <input id="phone" name="phone" type="tel" placeholder="+34..." required autocomplete="tel" />
        </div>

        <div class="field">
          <label for="telegramId" data-i18n="telegramIdLabel">Telegram ID *</label>
          <input id="telegramId" name="telegramId" type="text" inputmode="numeric" pattern="[0-9]+" placeholder="123456789" required />
          <span class="hint" data-i18n="telegramHint">Only the numeric Telegram ID, not @username.</span>
        </div>

        <div class="field full">
          <label for="email" data-i18n="emailLabel">E-Mail *</label>
          <input id="email" name="email" type="email" placeholder="email@example.com" required autocomplete="email" />
        </div>

        <div class="field">
          <label for="role" data-i18n="roleLabel">Role *</label>
          <select id="role" name="role" required>
            <option value="Security">Security</option>
            <option value="Hotel Concierge">Hotel Concierge</option>
            <option value="Barkeeper">Barkeeper</option>
            <option value="Promoter">Promoter</option>
            <option value="Taxi Driver">Taxi Driver</option>
            <option value="Other">Other</option>
          </select>
        </div>

        <div class="field">
          <label for="workplace" data-i18n="workplaceLabel">Workplace *</label>
          <input id="workplace" name="workplace" type="text" placeholder="Workplace" required />
        </div>

        <div class="field">
          <label for="language" data-i18n="languageLabel">Language *</label>
          <select id="language" name="language" required>
            <option value="EN">EN</option>
            <option value="ES">ES</option>
            <option value="DE">DE</option>
            <option value="FR">FR</option>
            <option value="IT">IT</option>
            <option value="NL">NL</option>
            <option value="RU">RU</option>
            <option value="AR">AR</option>
          </select>
        </div>

        <div class="field">
          <label for="paymentMethod" data-i18n="paymentMethodLabel">Payment method *</label>
          <select id="paymentMethod" name="paymentMethod" required>
            <option value="Revolut">Revolut</option>
            <option value="Bank Transfer">Bank Transfer</option>
            <option value="PayPal">PayPal</option>
            <option value="Cash">Cash</option>
            <option value="Bizum">Bizum</option>
          </select>
        </div>

        <div class="field full">
          <label for="paymentDetail" data-i18n="paymentDetailLabel">Payment detail *</label>
          <input id="paymentDetail" name="paymentDetail" type="text" placeholder="IBAN / @user / PayPal / Bizum" required />
        </div>

        <div class="field full">
          <label for="preview" data-i18n="previewLabel">Preview</label>
          <textarea id="preview" readonly></textarea>
        </div>

        <div class="actions">
          <button type="submit" class="primary" id="submitBtn">Open Telegram</button>
          <button type="button" class="secondary" id="copyBtn">Copy</button>
        </div>
      </form>
    </div>
  </div>

    function currentLang() {
      return uiLanguage.value || "en";
    }

    function t() {
      return translations[currentLang()] || translations.en;
    }

    function setText(selector, value) {
      const element = document.querySelector(selector);
      if (element) element.textContent = value;
    }

    function setPlaceholder(id, value) {
      const element = document.getElementById(id);
      if (element) element.placeholder = value;
    }

    function updateUIText() {
      const dict = t();
      const isRTL = currentLang() === "ar";

      document.documentElement.lang = currentLang();
      document.documentElement.dir = isRTL ? "rtl" : "ltr";
      app.classList.toggle("rtl", isRTL);

      document.getElementById("title").textContent = dict.title;
      document.getElementById("subtitle").textContent = dict.subtitle;
      document.getElementById("uiLanguageLabel").textContent = dict.uiLanguageLabel;
      document.getElementById("submitBtn").textContent = dict.submitBtn;
      document.getElementById("copyBtn").textContent = dict.copyBtn;

      setText('[data-i18n="firstNameLabel"]', dict.firstNameLabel);
      setText('[data-i18n="lastNameLabel"]', dict.lastNameLabel);
      setText('[data-i18n="phoneLabel"]', dict.phoneLabel);
      setText('[data-i18n="telegramIdLabel"]', dict.telegramIdLabel);
      setText('[data-i18n="telegramHint"]', dict.telegramHint);
      setText('[data-i18n="emailLabel"]', dict.emailLabel);
      setText('[data-i18n="roleLabel"]', dict.roleLabel);
      setText('[data-i18n="workplaceLabel"]', dict.workplaceLabel);
      setText('[data-i18n="languageLabel"]', dict.languageLabel);
      setText('[data-i18n="paymentMethodLabel"]', dict.paymentMethodLabel);
      setText('[data-i18n="paymentDetailLabel"]', dict.paymentDetailLabel);
      setText('[data-i18n="previewLabel"]', dict.previewLabel);

      setPlaceholder("firstName", dict.placeholders.firstName);
      setPlaceholder("lastName", dict.placeholders.lastName);
      setPlaceholder("phone", dict.placeholders.phone);
      setPlaceholder("telegramId", dict.placeholders.telegramId);
      setPlaceholder("email", dict.placeholders.email);
      setPlaceholder("workplace", dict.placeholders.workplace);
      setPlaceholder("paymentDetail", dict.placeholders.paymentDetail);

      updatePreview();
    }

      const data = new FormData(form);
      const dict = t().fields;

        "",
        `${dict.firstName}: ${data.get("firstName") || ""}`,
        `${dict.lastName}: ${data.get("lastName") || ""}`,
        `${dict.phone}: ${data.get("phone") || ""}`,
        `${dict.telegramId}: ${data.get("telegramId") || ""}`,
        `${dict.email}: ${data.get("email") || ""}`,
        `${dict.role}: ${data.get("role") || ""}`,
        `${dict.workplace}: ${data.get("workplace") || ""}`,
        `${dict.language}: ${data.get("language") || ""}`,
        `${dict.paymentMethod}: ${data.get("paymentMethod") || ""}`,
        `${dict.paymentDetail}: ${data.get("paymentDetail") || ""}`
      ].join("\n");
    }

    function updatePreview() {
      preview.value = getMessage();
    }

    form.addEventListener("input", updatePreview);
    form.addEventListener("change", updatePreview);
    uiLanguage.addEventListener("change", updateUIText);

    form.addEventListener("submit", function(e) {
      e.preventDefault();
      if (!form.reportValidity()) return;

      const encoded = encodeURIComponent(getMessage());
      const webFallback = `https://t.me/${TELEGRAM_USERNAME}?text=${encoded}`;

      window.open(webFallback, "_blank", "noopener,noreferrer");
    });

    copyBtn.addEventListener("click", async function() {
      try {
        await navigator.clipboard.writeText(getMessage());
        const oldText = t().copyBtn;
        copyBtn.textContent = t().copied;
        setTimeout(() => {
          copyBtn.textContent = oldText;
        }, 1200);
      } catch {
        preview.select();
        document.execCommand("copy");
      }
    });

    updateUIText();
  </script>
</body>
</html>
