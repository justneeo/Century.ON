<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Multilingual Telegram Form</title>
  <style>
    :root{
      --bg:#0f1115;
      --card:#171a21;
      --border:#2b3140;
      --text:#f5f7fb;
      --muted:#a9b1c3;
      --accent:#5b8cff;
      --accent-hover:#4a78e6;
      --input:#11151d;
      --radius:14px;
    }

    *{box-sizing:border-box}

    body{
      margin:0;
      font-family:Inter, Arial, sans-serif;
      background:linear-gradient(180deg,#0b0e13 0%, #10141c 100%);
      color:var(--text);
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:24px;
    }

    .card{
      width:100%;
      max-width:860px;
      background:rgba(23,26,33,.96);
      border:1px solid var(--border);
      border-radius:20px;
      padding:28px;
      box-shadow:0 20px 60px rgba(0,0,0,.35);
    }

    .topbar{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:16px;
      margin-bottom:18px;
      flex-wrap:wrap;
    }

    h1{
      margin:0;
      font-size:28px;
    }

    p{
      margin:8px 0 0;
      color:var(--muted);
      line-height:1.5;
    }

    .lang-switch{
      min-width:180px;
    }

    form{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:16px;
      margin-top:22px;
    }

    .field{
      display:flex;
      flex-direction:column;
      gap:8px;
    }

    .field.full{
      grid-column:1 / -1;
    }

    label{
      font-size:14px;
      color:#dce2f0;
      font-weight:600;
    }

    input, select, textarea{
      width:100%;
      background:var(--input);
      color:var(--text);
      border:1px solid var(--border);
      border-radius:var(--radius);
      padding:14px 14px;
      font-size:15px;
      outline:none;
    }

    input:focus, select:focus, textarea:focus{
      border-color:var(--accent);
      box-shadow:0 0 0 3px rgba(91,140,255,.15);
    }

    textarea{
      min-height:170px;
      resize:vertical;
      font-family:inherit;
    }

    .actions{
      grid-column:1 / -1;
      display:flex;
      gap:12px;
      flex-wrap:wrap;
      margin-top:8px;
    }

    button{
      border:none;
      border-radius:12px;
      padding:14px 18px;
      font-size:15px;
      font-weight:700;
      cursor:pointer;
    }

    .primary{
      background:var(--accent);
      color:white;
    }

    .primary:hover{
      background:var(--accent-hover);
    }

    .secondary{
      background:#232938;
      color:#fff;
      border:1px solid var(--border);
    }

    .note{
      margin-top:14px;
      font-size:13px;
      color:var(--muted);
      line-height:1.5;
    }

    .rtl{
      direction:rtl;
      text-align:right;
    }

    @media (max-width:700px){
      form{
        grid-template-columns:1fr;
      }
    }
  </style>
</head>
<body>
  <div class="card" id="app">
    <div class="topbar">
      <div>
        <h1 id="title">Telegram Form</h1>
        <p id="subtitle">Complete the form and open Telegram with the predefined message for @invictuzzzzz.</p>
      </div>

      <div class="lang-switch">
        <label for="uiLanguage" id="uiLanguageLabel">Interface language</label>
        <select id="uiLanguage">
          <option value="en">English</option>
          <option value="es">Español</option>
          <option value="de">Deutsch</option>
          <option value="fr">Français</option>
          <option value="it">Italiano</option>
          <option value="nl">Nederlands</option>
          <option value="ru">Русский</option>
          <option value="ar">العربية</option>
        </select>
      </div>
    </div>

    <form id="telegramForm">
      <div class="field">
        <label for="package" data-i18n="packageLabel">Plan</label>
        <select id="package" name="package">
          <option value="Standard">Standard</option>
          <option value="Centurion">Centurion</option>
        </select>
      </div>

      <div class="field">
        <label for="name" data-i18n="nameLabel">Name *</label>
        <input id="name" name="name" type="text" placeholder="Your name" required />
      </div>

      <div class="field">
        <label for="telegramId" data-i18n="telegramIdLabel">Telegram ID *</label>
        <input id="telegramId" name="telegramId" type="text" placeholder="123456789" required />
      </div>

      <div class="field">
        <label for="phone" data-i18n="phoneLabel">Phone *</label>
        <input id="phone" name="phone" type="tel" placeholder="+34..." required />
      </div>

      <div class="field">
        <label for="email" data-i18n="emailLabel">E-Mail</label>
        <input id="email" name="email" type="email" placeholder="email@example.com" />
      </div>

      <div class="field">
        <label for="language" data-i18n="languageLabel">Language</label>
        <select id="language" name="language">
          <option value="DE">DE</option>
          <option value="ES">ES</option>
          <option value="EN">EN</option>
          <option value="FR">FR</option>
          <option value="IT">IT</option>
          <option value="NL">NL</option>
          <option value="RU">RU</option>
          <option value="AR">AR</option>
        </select>
      </div>

      <div class="field">
        <label for="role" data-i18n="roleLabel">Role *</label>
        <select id="role" name="role" required>
          <option value="Security">Security</option>
          <option value="Driver">Driver</option>
          <option value="Support">Support</option>
          <option value="Other">Other</option>
        </select>
      </div>

      <div class="field">
        <label for="location" data-i18n="locationLabel">Location</label>
        <input id="location" name="location" type="text" placeholder="City / Area" />
      </div>

      <div class="field">
        <label for="commissionModel" data-i18n="commissionModelLabel">Commission model</label>
        <select id="commissionModel" name="commissionModel">
          <option value="Standard">Standard</option>
          <option value="Individual">Individual</option>
        </select>
      </div>

      <div class="field">
        <label for="ownCommission" data-i18n="ownCommissionLabel">Own commission € *</label>
        <input id="ownCommission" name="ownCommission" type="number" min="0" step="0.01" value="20" required />
      </div>

      <div class="field full">
        <label for="paymentSection" data-i18n="paymentDataLabel">Payment details</label>
        <input id="paymentSection" name="paymentSection" type="text" value="Payment details" readonly />
      </div>

      <div class="field">
        <label for="paymentMethod" data-i18n="paymentMethodLabel">Payment method *</label>
        <select id="paymentMethod" name="paymentMethod" required>
          <option value="Revolut">Revolut</option>
          <option value="Bank Transfer">Bank Transfer</option>
          <option value="PayPal">PayPal</option>
          <option value="Cash">Cash</option>
          <option value="Bizum">Bizum</option>
        </select>
      </div>

      <div class="field">
        <label for="paymentDetail" data-i18n="paymentDetailLabel">Payment detail *</label>
        <input id="paymentDetail" name="paymentDetail" type="text" placeholder="IBAN, @user, PayPal..." required />
      </div>

      <div class="field full">
        <label for="preview" data-i18n="previewLabel">Message preview</label>
        <textarea id="preview" readonly></textarea>
      </div>

      <div class="actions">
        <button type="submit" class="primary" id="submitBtn">Open Telegram</button>
        <button type="button" id="copyBtn" class="secondary">Copy message</button>
      </div>
    </form>

    <div class="note" id="note">
      This form supports English, Spanish, German, French, Italian, Dutch, Russian and Arabic.
    </div>
  </div>

    function currentLang() {
      return uiLanguage.value || "en";
    }

    function t() {
      return translations[currentLang()];
    }

    function updateUIText() {
      const dict = t();

      document.documentElement.lang = currentLang();
      const isRTL = currentLang() === "ar";
      document.documentElement.dir = isRTL ? "rtl" : "ltr";
      app.classList.toggle("rtl", isRTL);

      document.getElementById("title").textContent = dict.title;
      document.getElementById("subtitle").textContent = dict.subtitle;
      document.getElementById("uiLanguageLabel").textContent = dict.uiLanguageLabel;
      document.getElementById("submitBtn").textContent = dict.submitBtn;
      document.getElementById("copyBtn").textContent = dict.copyBtn;
      document.getElementById("note").textContent = dict.note;

      document.querySelector('[data-i18n="packageLabel"]').textContent = dict.packageLabel;
      document.querySelector('[data-i18n="nameLabel"]').textContent = dict.nameLabel;
      document.querySelector('[data-i18n="telegramIdLabel"]').textContent = dict.telegramIdLabel;
      document.querySelector('[data-i18n="phoneLabel"]').textContent = dict.phoneLabel;
      document.querySelector('[data-i18n="emailLabel"]').textContent = dict.emailLabel;
      document.querySelector('[data-i18n="languageLabel"]').textContent = dict.languageLabel;
      document.querySelector('[data-i18n="roleLabel"]').textContent = dict.roleLabel;
      document.querySelector('[data-i18n="locationLabel"]').textContent = dict.locationLabel;
      document.querySelector('[data-i18n="commissionModelLabel"]').textContent = dict.commissionModelLabel;
      document.querySelector('[data-i18n="ownCommissionLabel"]').textContent = dict.ownCommissionLabel;
      document.querySelector('[data-i18n="paymentDataLabel"]').textContent = dict.paymentDataLabel;
      document.querySelector('[data-i18n="paymentMethodLabel"]').textContent = dict.paymentMethodLabel;
      document.querySelector('[data-i18n="paymentDetailLabel"]').textContent = dict.paymentDetailLabel;
      document.querySelector('[data-i18n="previewLabel"]').textContent = dict.previewLabel;

      document.getElementById("name").placeholder = dict.placeholders.name;
      document.getElementById("telegramId").placeholder = dict.placeholders.telegramId;
      document.getElementById("phone").placeholder = dict.placeholders.phone;
      document.getElementById("email").placeholder = dict.placeholders.email;
      document.getElementById("location").placeholder = dict.placeholders.location;
      document.getElementById("paymentDetail").placeholder = dict.placeholders.paymentDetail;
      document.getElementById("paymentSection").value = dict.paymentDataLabel;

      updatePreview();
    }

    function getMessage() {
      const data = new FormData(form);
      const dict = t().fields;

      return [
        dict.requestTitle,
        "",
        `${dict.package}: ${data.get("package") || ""}`,
        `${dict.name}: ${data.get("name") || ""}`,
        `${dict.telegramId}: ${data.get("telegramId") || ""}`,
        `${dict.phone}: ${data.get("phone") || ""}`,
        `${dict.email}: ${data.get("email") || ""}`,
        `${dict.language}: ${data.get("language") || ""}`,
        `${dict.role}: ${data.get("role") || ""}`,
        `${dict.location}: ${data.get("location") || ""}`,
        `${dict.commissionModel}: ${data.get("commissionModel") || ""}`,
        `${dict.ownCommission}: ${data.get("ownCommission") || ""}`,
        "",
        `${dict.paymentData}`,
        `${dict.paymentMethod}: ${data.get("paymentMethod") || ""}`,
        `${dict.paymentDetail}: ${data.get("paymentDetail") || ""}`
      ].join("\n");
    }

    function updatePreview() {
      preview.value = getMessage();
    }

    form.addEventListener("input", updatePreview);
    form.addEventListener("change", updatePreview);

    uiLanguage.addEventListener("change", updateUIText);

    form.addEventListener("submit", function(e) {
      e.preventDefault();

      if (!form.reportValidity()) return;

      const message = getMessage();
      const encoded = encodeURIComponent(message);

      const tgDeepLink = `tg://resolve?domain=invictuzzzzz&text=${encoded}`;
      const webFallback = `https://t.me/invictuzzzzz?text=${encoded}`;

      window.location.href = tgDeepLink;

      setTimeout(() => {
        window.open(webFallback, "_blank");
      }, 700);
    });

    copyBtn.addEventListener("click", async function() {
      try {
        await navigator.clipboard.writeText(getMessage());
        const old = t().copyBtn;
        copyBtn.textContent = t().copied;
        setTimeout(() => {
          copyBtn.textContent = old;
        }, 1500);
      } catch {
        alert("Copy failed");
      }
    });

    updateUIText();
  </script>
</body>
</html>
