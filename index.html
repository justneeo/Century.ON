<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Telegram Form</title>
  <style>
    :root{
      --bg:#0f1115;
      --card:#171a21;
      --border:#2b3140;
      --text:#f5f7fb;
      --muted:#a9b1c3;
      --accent:#5b8cff;
      --accent-hover:#4a78e6;
      --input:#11151d;
      --radius:14px;
    }

    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:Inter, Arial, sans-serif;
      background:linear-gradient(180deg,#0b0e13 0%, #10141c 100%);
      color:var(--text);
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:24px;
    }

    .card{
      width:100%;
      max-width:760px;
      background:rgba(23,26,33,.96);
      border:1px solid var(--border);
      border-radius:20px;
      padding:28px;
      box-shadow:0 20px 60px rgba(0,0,0,.35);
    }

    h1{
      margin:0 0 8px;
      font-size:28px;
    }

    p{
      margin:0 0 24px;
      color:var(--muted);
      line-height:1.5;
    }

    form{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:16px;
    }

    .field{
      display:flex;
      flex-direction:column;
      gap:8px;
    }

    .field.full{
      grid-column:1 / -1;
    }

    label{
      font-size:14px;
      color:#dce2f0;
      font-weight:600;
    }

    input, select, textarea{
      width:100%;
      background:var(--input);
      color:var(--text);
      border:1px solid var(--border);
      border-radius:var(--radius);
      padding:14px 14px;
      font-size:15px;
      outline:none;
    }

    input:focus, select:focus, textarea:focus{
      border-color:var(--accent);
      box-shadow:0 0 0 3px rgba(91,140,255,.15);
    }

    textarea{
      min-height:140px;
      resize:vertical;
      font-family:inherit;
    }

    .actions{
      grid-column:1 / -1;
      display:flex;
      gap:12px;
      flex-wrap:wrap;
      margin-top:8px;
    }

    button{
      border:none;
      border-radius:12px;
      padding:14px 18px;
      font-size:15px;
      font-weight:700;
      cursor:pointer;
    }

    .primary{
      background:var(--accent);
      color:white;
    }

    .primary:hover{
      background:var(--accent-hover);
    }

    .secondary{
      background:#232938;
      color:#fff;
      border:1px solid var(--border);
    }

    .preview{
      margin-top:18px;
      background:#0f141d;
      border:1px solid var(--border);
      border-radius:16px;
      padding:16px;
      white-space:pre-wrap;
      color:#dce2f0;
      line-height:1.5;
    }

    .note{
      margin-top:14px;
      font-size:13px;
      color:var(--muted);
    }

    @media (max-width:700px){
      form{
        grid-template-columns:1fr;
      }
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Formulario Telegram</h1>
    <p>Completa los datos y se abrirá Telegram con el mensaje predefinido para <strong>@invictuzzzzz</strong>.</p>

    <form id="telegramForm">
      <div class="field">
        <label for="package">Plan</label>
        <select id="package" name="package">
          <option value="Standard">Standard</option>
          <option value="Centurion">Centurion</option>
        </select>
      </div>

      <div class="field">
        <label for="name">Nombre *</label>
        <input id="name" name="name" type="text" placeholder="Tu nombre" required />
      </div>

      <div class="field">
        <label for="telegramId">Telegram ID *</label>
        <input id="telegramId" name="telegramId" type="text" placeholder="123456789" required />
      </div>

      <div class="field">
        <label for="phone">Teléfono *</label>
        <input id="phone" name="phone" type="tel" placeholder="+34..." required />
      </div>

      <div class="field">
        <label for="email">E-Mail</label>
        <input id="email" name="email" type="email" placeholder="email@ejemplo.com" />
      </div>

      <div class="field">
        <label for="language">Idioma</label>
        <select id="language" name="language">
          <option value="DE" selected>DE</option>
          <option value="ES">ES</option>
          <option value="EN">EN</option>
          <option value="FR">FR</option>
          <option value="IT">IT</option>
        </select>
      </div>

      <div class="field">
        <label for="role">Rol *</label>
        <select id="role" name="role" required>
          <option value="Security" selected>Security</option>
          <option value="Driver">Driver</option>
          <option value="Support">Support</option>
          <option value="Other">Other</option>
        </select>
      </div>

      <div class="field">
        <label for="location">Ubicación</label>
        <input id="location" name="location" type="text" placeholder="Ciudad / Zona" />
      </div>

      <div class="field">
        <label for="commissionModel">Modelo de comisión</label>
        <select id="commissionModel" name="commissionModel">
          <option value="Standard" selected>Standard</option>
          <option value="Individual">Individual</option>
        </select>
      </div>

      <div class="field">
        <label for="ownCommission">Comisión propia € *</label>
        <input id="ownCommission" name="ownCommission" type="number" min="0" step="0.01" value="20" required />
      </div>

      <div class="field full">
        <label for="paymentSection">Zahlungsdaten</label>
        <input id="paymentSection" name="paymentSection" type="text" value="Zahlungsdaten" readonly />
      </div>

      <div class="field">
        <label for="paymentMethod">Método de pago *</label>
        <select id="paymentMethod" name="paymentMethod" required>
          <option value="Revolut" selected>Revolut</option>
          <option value="Überweisung">Überweisung</option>
          <option value="PayPal">PayPal</option>
          <option value="Bargeld">Bargeld</option>
          <option value="Bizum">Bizum</option>
        </select>
      </div>

      <div class="field">
        <label for="paymentDetail">Detalle de pago *</label>
        <input id="paymentDetail" name="paymentDetail" type="text" placeholder="Ej. @usuario, IBAN, PayPal..." required />
      </div>

      <div class="field full">
        <label for="preview">Vista previa del mensaje</label>
        <textarea id="preview" readonly></textarea>
      </div>

      <div class="actions">
        <button type="submit" class="primary">Abrir Telegram</button>
        <button type="button" id="copyBtn" class="secondary">Copiar mensaje</button>
      </div>
    </form>

    <div class="note">
      Enlace usado: <code>tg://resolve?domain=invictuzzzzz&text=...</code>. Telegram admite enlaces profundos para abrir chats públicos y rellenar el borrador del mensaje. :contentReference[oaicite:0]{index=0}
    </div>
  </div>

  <script>
    const form = document.getElementById("telegramForm");
    const preview = document.getElementById("preview");
    const copyBtn = document.getElementById("copyBtn");

    function getMessage() {
      const data = new FormData(form);

      return [
        "Neue Anfrage",
        "",
        "Plan: " + (data.get("package") || ""),
        "Nombre: " + (data.get("name") || ""),
        "Telegram ID: " + (data.get("telegramId") || ""),
        "Teléfono: " + (data.get("phone") || ""),
        "E-Mail: " + (data.get("email") || ""),
        "Idioma: " + (data.get("language") || ""),
        "Rol: " + (data.get("role") || ""),
        "Ubicación: " + (data.get("location") || ""),
        "Modelo de comisión: " + (data.get("commissionModel") || ""),
        "Comisión propia €: " + (data.get("ownCommission") || ""),
        "",
        "Zahlungsdaten",
        "Método de pago: " + (data.get("paymentMethod") || ""),
        "Detalle de pago: " + (data.get("paymentDetail") || "")
      ].join("\n");
    }

    function updatePreview() {
      preview.value = getMessage();
    }

    form.addEventListener("input", updatePreview);
    form.addEventListener("change", updatePreview);

    form.addEventListener("submit", function(e) {
      e.preventDefault();

      if (!form.reportValidity()) return;

      const message = getMessage();
      const encoded = encodeURIComponent(message);

      const tgDeepLink = `tg://resolve?domain=invictuzzzzz&text=${encoded}`;
      const webFallback = `https://t.me/invictuzzzzz?text=${encoded}`;

      // Intento app Telegram
      window.location.href = tgDeepLink;

      // Fallback web
      setTimeout(() => {
        window.open(webFallback, "_blank");
      }, 700);
    });

    copyBtn.addEventListener("click", async function() {
      try {
        await navigator.clipboard.writeText(getMessage());
        copyBtn.textContent = "Copiado";
        setTimeout(() => copyBtn.textContent = "Copiar mensaje", 1500);
      } catch {
        alert("No se pudo copiar el mensaje.");
      }
    });

    updatePreview();
  </script>
</body>
</html>
